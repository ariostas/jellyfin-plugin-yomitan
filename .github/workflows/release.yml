# On a version tag that is on main: all of CI, and the compat set on the oldest supported server. Then the zip, an
# install of it from a repository through the dashboard (an upgrade from the previous release when there is one), the
# GitHub release, and last the new version in manifest.json on main, which is the repository URL users add. Nothing is
# published unless every test passed, and the manifest only ever gains a version: scripts/lib/manifest.mjs refuses one
# that lost or changed any that main had. The release goes public just before the manifest is pushed, since a manifest
# that pointed at a draft would offer a zip no one can download. If that push fails, the release is out but not offered,
# and running the failed jobs again finishes it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browsers: chromium

      - name: The tag is the version in VERSION, on main
        run: |
          [[ $GITHUB_REF_NAME == "v$(cat VERSION)" ]] || { echo "Tag $GITHUB_REF_NAME, but VERSION says $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "Tag $GITHUB_REF_NAME is not on main. Push main first, or both with git push --atomic"; exit 1; }

      - name: Build and package
        run: |
          scripts/build.sh
          scripts/package.sh
          scripts/release-notes.sh "$GITHUB_REF_NAME" > out/release/notes.md
          cat out/release/notes.md

      # The release goes into the manifest on main as it is now, so check that before anything is published.
      - name: The manifest takes it
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git show origin/main:manifest.json > out/release/manifest.json
          zip=$(ls out/release/yomitan_*.zip)
          node scripts/lib/manifest.mjs add out/release/manifest.json "$zip" \
            "https://github.com/$REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")" out/release/notes.md

      # The newest release in the manifest, as users have it, upgraded to this one through the dashboard.
      - name: Install, or upgrade, from a repository
        run: |
          zips=()
          mkdir -p .dev
          git show origin/main:manifest.json > .dev/published.json
          previous=$(node scripts/lib/manifest.mjs latest .dev/published.json)
          if [[ -n $previous ]]; then
            read -r url checksum <<<"$previous"
            curl --fail --silent --show-error --location --output .dev/previous.zip "$url"
            [[ $(md5sum .dev/previous.zip | cut -d' ' -f1) == "$checksum" ]]
            zips+=("$PWD/.dev/previous.zip")
          fi
          zips+=("$(ls "$PWD"/out/release/yomitan_*.zip)")
          YOMITAN_CATALOGUE_ZIPS=$(IFS=,; echo "${zips[*]}") scripts/test-matrix.sh catalogue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/release/yomitan_*.zip
            out/release/notes.md
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-results
          path: tests/test-results
          retention-days: 14

  # The oldest server the manifest offers it to: JellyfinVersion in the csproj.
  oldest:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - name: The smoke set and playback on the oldest
        env:
          JF_IMAGE: oldest
        run: scripts/test-matrix.sh compat
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oldest-results
          path: tests/test-results
          retention-days: 14

  # GitHub turns a schedule off after 60 days with no commit, and says nothing, so the weekly run on the newest Jellyfin
  # would stop warning anyone. A release is when that matters.
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: The weekly run is on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/actions/workflows/scheduled.yml" --jq .state)
          [[ $state == active ]] ||
            { echo "The Scheduled workflow is $state. Turn it on with gh workflow enable scheduled.yml"; exit 1; }
          last=$(gh run list --workflow scheduled.yml --branch main --limit 1 --json conclusion,createdAt \
            --jq '.[0] // empty | "\(.conclusion) \(.createdAt)"')
          echo "Last weekly run: ${last:-none}"
          if [[ $last != success* ]] || (($(date +%s) - $(date -d "${last#* }" +%s) > 8 * 86400)); then
            echo "::warning::The last weekly run on main did not pass this week: ${last:-there is none}"
          fi

  publish:
    needs: [package, oldest, weekly]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The manifest is checked against every commit of it.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A draft until the zip is up, so no one sees a release without it. Running the job again skips what is done. A
      # release that is already there, from an earlier run or made by hand, must hold this run's zip, byte for byte: the
      # manifest takes its checksum from the zip on the release, and that must be the one the tests installed.
      - name: GitHub release, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(basename release/yomitan_*.zip)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "release/$name" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file release/notes.md
          fi
          mkdir published
          gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir published ||
            { echo "Release $GITHUB_REF_NAME has no $name. Upload it or delete the release, then run again"; exit 1; }
          cmp "release/$name" "published/$name" ||
            { echo "The $name on release $GITHUB_REF_NAME is not the one this run built and tested"; exit 1; }

      # The commit is made on main as it is at the moment of the push, so a commit that landed meanwhile is kept, and
      # made again if main moves in between. The first is made before the release goes public, so that only the push can
      # fail after it. The workflow's token starts no workflow, so CI never runs on this commit: the history check here
      # is the one CI would make.
      - name: Public, and in the manifest on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          name=$(basename release/yomitan_*.zip)
          url="https://github.com/$REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            node scripts/lib/manifest.mjs add manifest.json "published/$name" "$url" release/notes.md
            node scripts/lib/manifest.mjs check manifest.json --history
            git diff --quiet manifest.json ||
              git commit --quiet -m "chore: add ${GITHUB_REF_NAME#v} to the plugin manifest" manifest.json
          }
          commit

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          # What a server will download, from where the manifest says.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output downloaded.zip "$url"
          cmp "published/$name" downloaded.zip

          for attempt in 1 2 3; do
            git push --quiet origin HEAD:main && exit 0
            echo "main moved, attempt $attempt"
            commit
          done
          exit 1
